; NaNBuster scoped fixes
;
; Each fix is enabled by default. Set a fix to false to disable only that fix.
; Changes take effect after restarting Fallout 4.
;
; Color0LogClamp controls the original PS49B6A21CI0O1 COLOR0 correction.
; LambertDecodeGuard controls all twelve Lambert decoder guards as one fix.
; AnisotropicSpecularClamp controls the seven exact anisotropic specular upper clamps.
; IsotropicSpecularAA controls the exact f4b2da50 isotropic specular anti-aliasing fix.
; Accepted values: true, false, 1, 0 (case-insensitive).
; Missing settings default to true. Invalid values also default to true and
; produce a startup warning in the NaNBuster log.

[Fixes]
Color0LogClamp=true
LambertDecodeGuard=true
AnisotropicSpecularClamp=true
IsotropicSpecularAA=true
